# dsh-talk-mode — one plugin, two halves.
#
# 1. `preset-talk` — a tool-free agent preset, listed by the shipped New Session
#    preset control. Persona only: no tools, no AGENTS.md, no skills, no
#    runtime-context block. This is the "pure chat" surface.
# 2. `talk-mode-import` — a profile-level tool that walks the user through
#    importing a DeepSeek web account's conversations into the workspace.
#
# The two stay separated on purpose: the import tool is global (work sessions
# see it), and the Talk preset's scope half denies every global tool, so a Talk
# session never carries it. Importing is setup; chatting stays clean.
- insert:
    - id: preset-talk
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: talk
        name: Talk
        description: >-
          Pure conversation: no tools, no AGENTS.md, no skills, no runtime
          context.
        order: 0
        plugins:
          # A complete, tiny system prompt. `complete: true` replaces the
          # whole persona section instead of appending to it, and
          # `includeRuntimeContext: false` drops the cwd/platform/env block.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              complete: true
              includeRuntimeContext: false
              prefix: |-
                You are a conversation partner, not a coding agent.
                Reply naturally, in the user's own language and tone.
                You have no tools: no shell, no filesystem, no web access, no delegation.
                Do not offer to read or write files, run commands, search the web, or start tasks.
                If the user wants engineering work done, tell them to start a Work session.

          # Denies every tool the rest of the profile registered globally —
          # including this bundle's own import tool — so the Talk session sends
          # an empty tool catalog to the model.
          - id: talk-mode-scope
            name: 'dsh-talk-mode'

    # Profile-level: the import helper is a setup step for work sessions.
    - id: talk-mode-import
      name: 'dsh-talk-mode/import'
